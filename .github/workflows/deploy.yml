name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `master` branch
  push:
    branches: [master]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "Dist contents:"
          ls -la ./dist || { echo "dist folder not found"; exit 1; }
          echo "Size:"
          du -sh ./dist || true
          echo "Find top files (skip node_modules):"
          find ./dist -maxdepth 2 -type f -printf "%s\t%p\n" | sort -nr | head -n 20 || true
          # Ensure there is an index.html at the root of the artifact
          if [ ! -f ./dist/index.html ]; then
            echo "ERROR: ./dist/index.html not found — Pages needs an entry file at the root"
            exit 1
          fi
          # If you use a custom domain and commit a CNAME file in dist, show it
          if [ -f ./dist/CNAME ]; then
            echo "CNAME file contents:"
            cat ./dist/CNAME
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
